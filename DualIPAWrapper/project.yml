name: DualIPAWrapper
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
targets:
  DualIPAWrapper:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - ContentView.swift
    resources:
      - Resources
    entitlements:
      path: DualIPAWrapper.entitlements
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.example.DualIPAWrapper
      SWIFT_VERSION: "5.0"
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_CFBundleDisplayName: Dual IPA Wrapper
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
