name: Build Dual IPA Fixed

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Apply IPA import fix
        run: python3 scripts/fix_ipa_import.py

      - name: Generate Xcode project
        working-directory: DualIPAWrapper
        run: |
          set -euo pipefail
          xcodegen generate
          PROJECT_FILE="DualIPAWrapper.xcodeproj/project.pbxproj"
          if grep -q 'objectVersion = 77;' "$PROJECT_FILE"; then
            sed -i '' 's/objectVersion = 77;/objectVersion = 56;/' "$PROJECT_FILE"
          fi

      - name: Build unsigned Dual IPA
        working-directory: DualIPAWrapper
        run: |
          set -euo pipefail
          xcodebuild -project DualIPAWrapper.xcodeproj -scheme DualIPAWrapper -sdk iphoneos -configuration Release -derivedDataPath "$GITHUB_WORKSPACE/build" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build

      - name: Package Dual IPA
        run: |
          set -euo pipefail
          APP_PATH=$(find build/Build/Products -type d -name 'DualIPAWrapper.app' -print -quit)
          test -n "$APP_PATH"
          rm -rf Payload dist
          mkdir -p Payload dist
          cp -R "$APP_PATH" Payload/
          /usr/bin/zip -qry dist/DualIPAWrapper-unsigned.ipa Payload
          test -s dist/DualIPAWrapper-unsigned.ipa

      - name: Upload Dual IPA
        uses: actions/upload-artifact@v4
        with:
          name: DualIPAWrapper-unsigned
          path: dist/DualIPAWrapper-unsigned.ipa
          if-no-files-found: error
