name: Build Dual IPA Wrapper

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download IPA resources
        run: |
          set -e
          mkdir -p DualIPAWrapper/Resources /tmp/sideinstaller-patch
          curl -fL --retry 3 -o DualIPAWrapper/Resources/esign_5.0.2_unsigned.ipa \
            https://github.com/DeltaExploiting/Combinedapptesting/releases/download/62828/esign_5.0.2_unsigned.ipa
          curl -fL --retry 3 -o /tmp/sideinstaller-patch/SideInstaller-original.ipa \
            https://github.com/DeltaExploiting/Combinedapptesting/releases/download/Sideinstalltest/SideInstaller-sideinstaller-scheme.ipa
          test -s DualIPAWrapper/Resources/esign_5.0.2_unsigned.ipa
          test -s /tmp/sideinstaller-patch/SideInstaller-original.ipa

          unzip -q /tmp/sideinstaller-patch/SideInstaller-original.ipa -d /tmp/sideinstaller-patch/unpacked
          PLIST=$(find /tmp/sideinstaller-patch/unpacked/Payload -maxdepth 2 -name Info.plist -print -quit)
          test -n "$PLIST"

          python3 - "$PLIST" <<'PY'
import plistlib
import sys
from pathlib import Path

path = Path(sys.argv[1])
with path.open('rb') as f:
    plist = plistlib.load(f)

url_types = plist.setdefault('CFBundleURLTypes', [])
if not any('sideinstaller' in item.get('CFBundleURLSchemes', []) for item in url_types):
    url_types.append({
        'CFBundleTypeRole': 'Editor',
        'CFBundleURLName': plist.get('CFBundleIdentifier', 'com.frizzlem.sideinstaller'),
        'CFBundleURLSchemes': ['sideinstaller'],
    })

with path.open('wb') as f:
    plistlib.dump(plist, f, fmt=plistlib.FMT_BINARY)
PY

          rm -f DualIPAWrapper/Resources/SideInstaller.ipa
          (cd /tmp/sideinstaller-patch/unpacked && /usr/bin/zip -qry "$GITHUB_WORKSPACE/DualIPAWrapper/Resources/SideInstaller.ipa" Payload)
          test -s DualIPAWrapper/Resources/SideInstaller.ipa
          echo "ESign and the SideInstaller IPA with sideinstaller:// support are ready."

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: DualIPAWrapper
        run: |
          set -e
          xcodegen generate
          PROJECT_FILE="DualIPAWrapper.xcodeproj/project.pbxproj"
          if grep -q 'objectVersion = 77;' "$PROJECT_FILE"; then
            sed -i '' 's/objectVersion = 77;/objectVersion = 56;/' "$PROJECT_FILE"
          fi

      - name: Build unsigned app
        working-directory: DualIPAWrapper
        run: |
          set -e
          xcodebuild \
            -project DualIPAWrapper.xcodeproj \
            -scheme DualIPAWrapper \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath "$GITHUB_WORKSPACE/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package IPA
        run: |
          set -e
          APP_PATH=$(find build/Build/Products -type d -name 'DualIPAWrapper.app' -print -quit)
          test -n "$APP_PATH"
          rm -rf Payload DualIPAWrapper-unsigned.ipa
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          /usr/bin/zip -qry DualIPAWrapper-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: DualIPAWrapper-unsigned-ipa
          path: DualIPAWrapper-unsigned.ipa
          if-no-files-found: error
