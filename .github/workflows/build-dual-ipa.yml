name: Build Dual IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Fix SwiftUI certificate color expression
        working-directory: DualIPAWrapper
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('ContentView.swift')
          s = p.read_text()
          old = '.foregroundStyle(selected.contains(certificate.name) ? .tint : .secondary)'
          new = '.foregroundStyle(selected.contains(certificate.name) ? Color.accentColor : Color.secondary)'
          if old in s:
              s = s.replace(old, new)
              p.write_text(s)
          PY

      - name: Fix IPA document picker import
        working-directory: DualIPAWrapper
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('ContentView.swift')
          s = p.read_text()
          old = 'let picker = UIDocumentPickerViewController(forOpeningContentTypes: [UTType.item])\n        picker.allowsMultipleSelection = true\n        picker.delegate = context.coordinator'
          new = 'let picker = UIDocumentPickerViewController(documentTypes: [UTType.item.identifier], in: .import)\n        picker.allowsMultipleSelection = true\n        picker.delegate = context.coordinator'
          if old in s:
              s = s.replace(old, new, 1)
          else:
              raise SystemExit('IPA picker initializer not found')

          old_callback = 'func documentPicker(_ controller: UIDocumentPickerViewController, didPickDocumentsAt urls: [URL]) {\n            parent.picked(urls)\n        }'
          new_callback = 'func documentPicker(_ controller: UIDocumentPickerViewController, didPickDocumentsAt urls: [URL]) {\n            DispatchQueue.main.async {\n                self.parent.picked(urls)\n            }\n        }'
          if old_callback in s:
              s = s.replace(old_callback, new_callback, 1)
          else:
              raise SystemExit('IPA picker callback not found')
          p.write_text(s)
          PY

      - name: Generate Xcode project
        working-directory: DualIPAWrapper
        run: |
          set -euo pipefail
          xcodegen generate
          PROJECT_FILE="DualIPAWrapper.xcodeproj/project.pbxproj"
          if grep -q 'objectVersion = 77;' "$PROJECT_FILE"; then
            sed -i '' 's/objectVersion = 77;/objectVersion = 56;/' "$PROJECT_FILE"
          fi

      - name: Build unsigned Dual IPA
        working-directory: DualIPAWrapper
        run: |
          set -euo pipefail
          xcodebuild \
            -project DualIPAWrapper.xcodeproj \
            -scheme DualIPAWrapper \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath "$GITHUB_WORKSPACE/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package Dual IPA
        run: |
          set -euo pipefail
          APP_PATH=$(find build/Build/Products -type d -name 'DualIPAWrapper.app' -print -quit)
          test -n "$APP_PATH"
          rm -rf Payload dist
          mkdir -p Payload dist
          cp -R "$APP_PATH" Payload/
          /usr/bin/zip -qry dist/DualIPAWrapper-unsigned.ipa Payload

      - name: Upload Dual IPA
        uses: actions/upload-artifact@v4
        with:
          name: DualIPAWrapper-unsigned
          path: dist/DualIPAWrapper-unsigned.ipa
          if-no-files-found: error