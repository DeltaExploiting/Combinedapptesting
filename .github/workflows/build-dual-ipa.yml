name: Build Dual IPA Wrapper

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download IPA resources from release 62828
        run: |
          set -e
          mkdir -p DualIPAWrapper/Resources
          curl -fL --retry 3 -o DualIPAWrapper/Resources/esign_5.0.2_unsigned.ipa \
            https://github.com/DeltaExploiting/Combinedapptesting/releases/download/62828/esign_5.0.2_unsigned.ipa
          curl -fL --retry 3 -o DualIPAWrapper/Resources/SideInstaller.ipa \
            https://github.com/DeltaExploiting/Combinedapptesting/releases/download/62828/SideInstaller.ipa
          test -s DualIPAWrapper/Resources/esign_5.0.2_unsigned.ipa
          test -s DualIPAWrapper/Resources/SideInstaller.ipa
          echo "Both IPA resources downloaded successfully."

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: DualIPAWrapper
        run: |
          set -e
          xcodegen generate
          PROJECT_FILE="DualIPAWrapper.xcodeproj/project.pbxproj"
          if grep -q 'objectVersion = 77;' "$PROJECT_FILE"; then
            sed -i '' 's/objectVersion = 77;/objectVersion = 56;/' "$PROJECT_FILE"
          fi

      - name: Build unsigned app
        working-directory: DualIPAWrapper
        run: |
          set -e
          xcodebuild \
            -project DualIPAWrapper.xcodeproj \
            -scheme DualIPAWrapper \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath "$GITHUB_WORKSPACE/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package IPA
        run: |
          set -e
          APP_PATH=$(find build/Build/Products -type d -name 'DualIPAWrapper.app' -print -quit)
          test -n "$APP_PATH"
          rm -rf Payload DualIPAWrapper-unsigned.ipa
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          /usr/bin/zip -qry DualIPAWrapper-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: DualIPAWrapper-unsigned-ipa
          path: DualIPAWrapper-unsigned.ipa
          if-no-files-found: error
